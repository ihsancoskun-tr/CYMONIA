name: NOV Runtime

on:
  push:
    branches:
      - nov/persistent-runtime-2026-11-16
    paths:
      - "nov-runtime/**"
      - "wrangler.nov.toml"
      - ".github/workflows/deploy-nov.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test N-007 migration contract
        run: node --test nov-runtime/tests/*.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: nov-runtime
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOV_ADMIN_TOKEN: ${{ secrets.NOV_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Cloudflare deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Deploy isolated N-007 Durable Object Worker
        run: npx wrangler deploy --config wrangler.nov.toml
      - name: Configure private snapshot-import token when supplied
        if: env.NOV_ADMIN_TOKEN != ''
        run: printf '%s' "$NOV_ADMIN_TOKEN" | npx wrangler secret put NOV_ADMIN_TOKEN --config wrangler.nov.toml
