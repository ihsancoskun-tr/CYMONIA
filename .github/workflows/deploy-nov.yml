name: NOV Runtime

on:
  push:
    branches:
      - nov/persistent-runtime-2026-11-16
    paths:
      - "nov-runtime/**"
      - "wrangler.nov.toml"
      - ".github/workflows/deploy-nov.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test N-007 migration contract
        run: node --test nov-runtime/tests/*.test.mjs
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --config wrangler.nov.toml --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOV_ADMIN_TOKEN: ${{ secrets.NOV_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Skip deployment when Cloudflare credentials are not configured
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.NOV_ADMIN_TOKEN == ''
        run: echo "Tests can run without deployment credentials; deployment skipped safely."
      - name: Install Wrangler
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NOV_ADMIN_TOKEN != ''
        run: npm install --no-save wrangler@4
      - name: Deploy isolated N-007 Durable Object Worker
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NOV_ADMIN_TOKEN != ''
        run: npx wrangler deploy --config wrangler.nov.toml
      - name: Configure private snapshot-import token
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.NOV_ADMIN_TOKEN != ''
        run: printf '%s' "$NOV_ADMIN_TOKEN" | npx wrangler secret put NOV_ADMIN_TOKEN --config wrangler.nov.toml
